id: assistant
name: Assistant
version: "1.0.2"
hubra: ">=0.2,<1"
description: "Drafts for the board with Claude: posts, invitations, reminders and summaries of minutes, in the club's tone. Uses the club's own Anthropic API key, only after the club agrees."
author: Hubra
homepage: https://github.com/hubra-app/hubra-plugin-assistant
license: AGPL-3.0-or-later
tags: [ai, writing, board]
package: hubra_assistant
modules: [assistant]
requires: [members]
migrations: migrations
frontend: frontend/dist/plugin.js
# The areas this plugin extends; Hubra refuses a plugin that touches one it
# doesn't list. See docs/plugins.md in hubra-app/hubra.
uses: [routes, tables, settings, nav, frontend]
